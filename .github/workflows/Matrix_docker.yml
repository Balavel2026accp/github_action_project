name: Matrix with Docker

on:
  push:

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-20.04]
        image: [hello-world, alpine]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Docker Version
        run: |
          docker version
          docker info

      - name: Run Docker Image
        run: docker run ${{ matrix.image }}